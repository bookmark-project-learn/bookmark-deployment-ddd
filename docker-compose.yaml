services:
  redis:
    image: redis:alpine
    container_name: redis
  bookmark_service:
    image: dungi3/bookmark_deployment_bookmark_service:v0.0.1
    build: .
    container_name: bookmark_service
    env_file:
      - ./bookmark/bookmark_service.env
      - ./bookmark/bookmark_postgre.env
    depends_on:
      redis:
        condition: service_started
      bookmark_postgres:
        condition: service_healthy

  user_service:
    image: dungi3/bookmark_deployment_user_service:v0.0.1
    build: .
    container_name: user_service
    env_file:
      - ./user/user_service.env
      - ./user/user_postgre.env
    depends_on:
      user_postgres:
        condition: service_healthy

  
  bookmark_postgres:
    container_name: bookmark_postgres
    image: postgres:alpine
    env_file:
      - ./bookmark/bookmark_postgre.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bookmark"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./bookmark/postgre-data:/var/lib/postgresql


  portal:
    image: ebvn/bookmark-app-portal:mono
    container_name: portal

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:Z
    depends_on:
      - portal
      - bookmark_service

  user_postgres:
    container_name: user_postgres
    image: postgres:alpine
    env_file:
      - ./user/user_postgre.env
      - ./user/user_service.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./user/postgre-data:/var/lib/postgresql