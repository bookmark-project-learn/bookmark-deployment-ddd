name: cd-pipeline
# runner name: bookmark-deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  cd_pipeline_bookmark_service:
    runs-on: 
      - self-hosted
      - bookmark-label
    steps:
      - name: Run script
        run: |
          cd /bookmark-src/bookmark-deployment-ddd
          git fetch
          git checkout main
          git pull origin main
          make generate-rsa-key
          make deploy-bookmark-service
          make deploy-user-service
          make clean-deploy-prune
