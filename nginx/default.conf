# load balancing for multiple bookmark_service, with port open
upstream bookmark_service {
    server bookmark_service:8080;
}

upstream portal {
    server portal:3000;
}

limit_req_zone $binary_remote_addr zone=public_api:10m rate=15r/m;

server {
    listen 80;
    server_name bookmark_service;
    # provide portal upstream call
    location / {
        proxy_http_version 1.1;
        proxy_pass http://portal/;
    }
    # provide bookmark_service upstream call
    location /api/bookmark_service/ {
        proxy_http_version 1.1;
        proxy_pass http://bookmark_service/;
        limit_req zone=public_api burst=10 nodelay;
    }
    # user_service
    location /api/user_service/ {
        proxy_pass http://user_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=public_api burst=10 nodelay;

    }

}